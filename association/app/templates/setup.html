{% extends 'layout.html' %}
{% block content %}
<h2 class="mb-3">配置中心</h2>
<p>当前数据库：<code>{{ database_url }}</code></p>
{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}
<form class="row g-3" method="post">
  <div class="card">
    <div class="card-header">安全设置</div>
    <div class="card-body">
      <div class="col-md-6">
        <label class="form-label">设置密码</label>
        <input class="form-control" name="setup_password" type="password" required />
        <div class="form-text">请输入在环境变量中设置的 `SETUP_PASSWORD`。</div>
      </div>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-header">数据库配置</div>
    <div class="card-body row g-3">
      <div class="col-md-6">
        <label class="form-label">主机</label>
        <input class="form-control" name="host" />
      </div>
      <div class="col-md-6">
        <label class="form-label">端口</label>
        <input class="form-control" name="port" value="3306" />
      </div>
      <div class="col-md-4">
        <label class="form-label">用户名</label>
        <input class="form-control" name="user" />
      </div>
      <div class="col-md-4">
        <label class="form-label">密码</label>
        <input class="form-control" name="password" />
      </div>
      <div class="col-md-4">
        <label class="form-label">库名</label>
        <input class="form-control" name="dbname" />
      </div>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-header">创建会长账号</div>
    <div class="card-body row g-3">
      <div class="col-md-4"><label class="form-label">姓名</label><input class="form-control" name="admin_name" /></div>
      <div class="col-md-4"><label class="form-label">学号</label><input class="form-control" name="admin_student_id" /></div>
      <div class="col-md-4"><label class="form-label">班级</label><input class="form-control" name="admin_class_name" /></div>
      <div class="col-md-3"><label class="form-label">性别</label>
        <select class="form-select" name="admin_gender">
          <option value="男">男</option>
          <option value="女">女</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="col-md-3"><label class="form-label">年级</label><input class="form-control" name="admin_grade" /></div>
      <div class="col-md-3"><label class="form-label">手机号</label><input class="form-control" name="admin_phone" /></div>
      <div class="col-md-3"><label class="form-label">邮箱</label><input class="form-control" name="admin_email" /></div>
      <div class="col-md-6"><label class="form-label">密码</label><input class="form-control" type="password" name="admin_password" /></div>
    </div>
  </div>

  <div class="col-12 mt-4">
    <button class="btn btn-primary" type="submit">执行操作</button>
  </div>
</form>
<p class="mt-3 text-muted">数据库和会长账号信息，只需填写一次。后续如需修改，请直接操作数据库或联系技术支持。</p>
{% endblock %}
